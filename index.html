<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노는법 레퍼런스 창고</title>
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151916" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="노는법 레퍼런스">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237a4fd6'/%3E%3Cpath d='M20 14h24v38l-12-9-12 9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
<style>
/* Layout: 오가닉 / paid-ads 두 공간을 위 탭으로 오가고, 정해둔 태그 그룹으로 겹쳐서 거르는 팀 스크랩 보드. */
:root {
  --bg: #eef0ec; --surface: #ffffff; --ink: #1d221f; --muted: #66706a; --line: #d6dbd5;
  --accent: #7a4fd6; --accent-ink: #ffffff; --chip: #e4e8e2; --danger: #c8372d;
  --c-organic: #1f9a6a; --c-paid: #3a6df0;
  --f-display: "Black Han Sans", "Gothic A1", system-ui, sans-serif;
  --f-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151916; --surface: #1f2420; --ink: #eef1ec; --muted: #9aa49d; --line: #333a35;
    --accent: #a888ff; --accent-ink: #160d2a; --chip: #2a302b; --danger: #ff6b5f;
    --c-organic: #4fd1a0; --c-paid: #7b9dff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: grid; gap: 18px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: grid; gap: 4px; }
.brand small { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .08em; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 6vw, 40px); line-height: 1; margin: 0; letter-spacing: -0.01em; }
.brand h1 .dot { color: var(--accent); }
.head-acts { display: flex; align-items: center; gap: 10px; }
.who { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.foot { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 40px; padding-top: 16px; border-top: 1px dashed var(--line); }
.foot .btn-ghost { font-size: 12px; font-weight: 600; }
.btn-add { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 800; font-size: 15px; }
.btn-add:disabled { opacity: .5; cursor: wait; }
.btn-ghost { background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 700; padding: 8px; border-radius: 8px; }
.btn-ghost:hover { background: var(--chip); }

/* 공간 전환 */
.spaces { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 2px solid var(--line); }
.space { border: 0; background: none; padding: 10px 6px 12px; font-weight: 800; font-size: 16px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; display: grid; gap: 2px; justify-items: center; }
.space .n { font-family: var(--f-mono); font-size: 12px; font-weight: 500; }
.space[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--cat); }
.space-hint { margin: -6px 0 0; color: var(--muted); font-size: 13px; }

/* 필터 */
.filters { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.search { width: 100%; min-width: 0; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 16px; }
.fgroup { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; align-items: start; }
.fgroup > span { font-size: 12px; font-weight: 800; color: var(--muted); padding-top: 6px; letter-spacing: .02em; }
@media (max-width: 480px) { .fgroup { grid-template-columns: 1fr; gap: 4px; } .fgroup > span { padding-top: 0; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 700; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
.chip .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--cat); border-color: var(--cat); color: #fff; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
.chip.free { border-style: dashed; }
.freset { justify-self: start; }

/* 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.thumb { aspect-ratio: 4 / 5; max-width: 100%; background: var(--chip); position: relative; display: grid; place-items: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { font-family: var(--f-display); font-size: 26px; color: var(--cat); text-align: center; padding: 0 16px; line-height: 1.15; }
.thumb.short { aspect-ratio: 16 / 7; }
.label { position: absolute; top: 10px; left: 10px; background: var(--cat); color: #fff; font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 6px; letter-spacing: .02em; }
.plat { position: absolute; top: 10px; right: 10px; background: var(--surface); color: var(--ink); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); }
.body { padding: 14px 16px 16px; display: grid; gap: 10px; min-width: 0; }
.body h3 { margin: 0; font-size: 16px; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; text-wrap: balance; }
.src { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; margin-top: -6px; }
.why { margin: 0; font-size: 14px; line-height: 1.6; border-left: 3px solid var(--cat, var(--muted)); padding-left: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.k { display: block; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .06em; }
.idea { margin: 0; font-size: 14px; line-height: 1.6; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.idea .k { color: var(--accent); }
.script { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.script summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
.script summary::-webkit-details-marker { display: none; }
.script summary::after { content: "펼치기"; font-weight: 700; color: var(--accent); letter-spacing: 0; }
.script[open] summary::after { content: "접기"; }
.script .txt { margin: 0; padding: 0 10px 8px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; }
.mini { border: 0; background: var(--chip); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: var(--ink); }
.script .mini { margin: 0 10px 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags span { background: var(--chip); border-radius: 5px; padding: 2px 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
.tags span.pt { background: color-mix(in srgb, var(--cat) 16%, var(--surface)); color: var(--ink); }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; border-top: 1px dashed var(--line); }
.meta .by { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: grid; line-height: 1.35; }
.acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.acts a, .acts button { border: 0; background: none; font-size: 13px; font-weight: 700; color: var(--muted); padding: 6px 8px; border-radius: 6px; text-decoration: none; }
.acts a { color: var(--accent); }
.acts button:hover, .acts a:hover { background: var(--chip); }
.del.armed { color: var(--danger) !important; }

.empty, .notice { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 14px; padding: 32px 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty strong { color: var(--ink); font-size: 17px; }
.notice code { font-family: var(--f-mono); font-size: 12px; color: var(--danger); overflow-wrap: anywhere; }

/* 로그인 */
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.login form { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; display: grid; gap: 14px; }
.login h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1; margin: 0 0 4px; }
.login h1 .dot { color: var(--accent); }
.login p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
.login .btn-add { width: 100%; }

/* 입력 시트 */
.sheet { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--surface); border-radius: 16px; width: min(580px, 100%); max-height: 100%; overflow-y: auto; padding: 22px; display: grid; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 800; }
.field small { color: var(--muted); font-size: 12px; font-weight: 500; }
.field small.req { color: var(--danger); font-weight: 800; }
.field input, .field select, .field textarea { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; font-size: 16px; }
.field textarea { min-height: 84px; resize: vertical; }
.field textarea.tall { min-height: 140px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
.catpick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.catpick button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 800; }
.catpick button[aria-pressed="true"] { background: var(--cat); border-color: var(--cat); color: #fff; }
.taggroups { display: grid; gap: 12px; background: var(--bg); border-radius: 12px; padding: 12px; }
.taggroups .field > span { font-size: 12px; }
.taggroups .chip { background: var(--surface); }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); font-size: 13px; display: grid; gap: 8px; justify-items: center; }
.drop.over { border-color: var(--accent); color: var(--ink); }
.drop img { max-height: 160px; border-radius: 8px; }
.lnk { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 13px; padding: 0; }
.panel-acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.panel-acts button { border-radius: 999px; padding: 10px 18px; font-weight: 800; border: 1.5px solid var(--line); background: none; }
.panel-acts .save { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.panel-acts .save:disabled { opacity: .6; cursor: wait; }
.err { color: var(--danger); font-size: 13px; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s ease; } .card:hover { transform: translateY(-2px); } }
</style>
</head>
<body>

<!-- 로그인 -->
<section class="login" id="loginView" hidden>
  <form id="loginForm">
    <h1>레퍼런스 창고<span class="dot">.</span></h1>
    <p>노는법 팀 전용. 관리자가 만들어 준 계정으로 로그인해 주세요.</p>
    <label class="field"><span>이메일</span>
      <input id="l-email" type="email" autocomplete="username" required>
    </label>
    <label class="field"><span>비밀번호</span>
      <input id="l-pw" type="password" autocomplete="current-password" required>
    </label>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn-add" type="submit" id="loginBtn">로그인</button>
  </form>
</section>

<!-- 메인 -->
<div class="wrap" id="appView" hidden>
  <header class="top">
    <div class="brand"><small>노는법 마케팅팀</small><h1>레퍼런스 창고<span class="dot">.</span></h1></div>
    <div class="head-acts">
      <button class="btn-add" id="addBtn" type="button">+ 추가</button>
    </div>
  </header>

  <nav class="spaces" id="spaces" aria-label="카테고리"></nav>
  <p class="space-hint" id="spaceHint"></p>

  <div class="filters" id="filters">
    <input class="search" id="q" type="search" placeholder="제목, 메모, 카피, 계정으로 찾기">
    <div id="fgroups" style="display:grid;gap:8px"></div>
    <button class="btn-ghost freset" id="freset" type="button" hidden>필터 모두 풀기</button>
  </div>

  <div id="status" hidden></div>
  <section id="list" class="grid" aria-live="polite"></section>
  <footer class="foot"><span class="who" id="who"></span><button class="btn-ghost" id="logoutBtn" type="button">로그아웃</button></footer>
</div>

<!-- 레퍼런스 입력 -->
<div class="sheet" id="refSheet" hidden>
  <form class="panel" id="refForm" autocomplete="off">
    <h2 id="refFormTitle">레퍼런스 추가</h2>
    <div class="field"><span>카테고리</span><div class="catpick" id="f-cat"></div></div>
    <label class="field"><span>링크</span>
      <input id="f-url" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/...">
    </label>
    <label class="field"><span>제목</span>
      <input id="f-title" type="text" placeholder="예: 대문 여는 손 클로즈업으로 시작하는 숙소 릴스">
    </label>
    <div class="row2">
      <label class="field"><span>계정 · 광고주</span>
        <input id="f-src" type="text" placeholder="예: @localtrip">
      </label>
      <label class="field" id="periodField"><span>게재 기간 <small>오래 돌수록 잘된 광고</small></span>
        <input id="f-period" type="text" placeholder="예: 2026.09~ 운영 중">
      </label>
    </div>
    <div class="taggroups" id="f-groups"></div>
    <label class="field"><span>기타 태그 <small>지역·업종 등 자유롭게, 쉼표로 구분</small></span>
      <input id="f-tags" type="text" placeholder="숙소, 전남, 경쟁사">
    </label>
    <label class="field"><span>왜 저장했나</span>
      <textarea id="f-why" placeholder="예: 첫 1초에 손이 문고리를 잡는 클로즈업. 소리부터 들려서 멈추게 됨"></textarea>
    </label>
    <label class="field"><span>응용 아이디어 <small>노는법에선 이렇게 써보기</small></span>
      <textarea id="f-idea" placeholder="예: 담양 독채 소개 릴스 첫 컷을 대문 여는 손으로. 대나무 바람 소리 먼저 깔기"></textarea>
    </label>
    <label class="field"><span>카피 · 스크립트 <small>문구, 자막, 대사를 그대로 옮겨두기</small></span>
      <textarea id="f-copy" class="tall" placeholder="예:&#10;이 문 열면 뭐가 있게요?&#10;담양 대나무밭 바로 앞 독채예요"></textarea>
    </label>
    <div class="field"><span>캡처 이미지 <small>(선택)</small></span>
      <div class="drop" id="drop">
        <img id="f-prev" alt="" hidden>
        <span id="dropMsg">캡처를 여기에 붙여넣기(⌘V/Ctrl+V)하거나 끌어다 놓기</span>
        <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
          <button class="lnk" type="button" id="pickImg">사진에서 고르기</button>
          <button class="lnk" type="button" id="clearImg" hidden>이미지 빼기</button>
        </div>
        <input id="f-file" type="file" accept="image/*" hidden>
      </div>
    </div>
    <p class="err" id="refErr" hidden></p>
    <div class="panel-acts">
      <button type="button" data-close>취소</button>
      <button type="submit" class="save" id="refSave">저장</button>
    </div>
  </form>
</div>

<script>
/* ===== 설정 — 회사용 Supabase 프로젝트 값으로 바꿔 넣기 ===== */
const SUPABASE_URL = "https://pgkzzmrekjlmlbqbydtb.supabase.co";
const SUPABASE_KEY = "sb_publishable_zIhHcdmc_S8xXYr-m8su8Q__Z3GJexF";
const BUCKET = "ref-images";

/* 카테고리와 태그 그룹. 태그는 "그룹id:값"으로 저장돼서 그룹 이름을 바꿔도 데이터는 그대로예요. */
const CATS = {
  organic: {
    name: "오가닉", color: "var(--c-organic)",
    hint: "우리 계정·다른 계정의 오가닉 콘텐츠. 릴스, 카드뉴스, 블로그, 틱톡.",
    groups: [
      { id: "format", name: "포맷", opts: ["릴스", "카드뉴스", "블로그", "틱톡"] },
      { id: "point", name: "참고 포인트", opts: ["카피", "디자인", "기획"], required: true },
    ],
  },
  paid: {
    name: "paid-ads", color: "var(--c-paid)",
    hint: "광고 소재. 메타 광고 라이브러리에서 봤다면 게재 기간도 같이 적어 두기.",
    groups: [
      { id: "format", name: "포맷", opts: ["이미지", "영상"] },
      { id: "appeal", name: "소구 방식", opts: ["할인율강조", "부정화법", "가격표시", "마감임박/한정", "후기/사회적증거", "비밀링크", "기타"] },
      { id: "point", name: "참고 포인트", opts: ["카피", "디자인"], required: true },
    ],
  },
};
const $ = id => document.getElementById(id);

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const emptySel = () => Object.fromEntries(Object.entries(CATS).map(([k, c]) => [k, Object.fromEntries([...c.groups.map(g => [g.id, new Set()]), ["free", new Set()]])]));
const S = { cat: "organic", refs: [], loaded: false, sel: emptySel(), query: "" };
let user = null;
try { const c = localStorage.getItem("nnb-ref-cat"); if (CATS[c]) S.cat = c; } catch {}

/* ===== 공통 ===== */
const tagKey = (g, v) => `${g}:${v}`;
const isGroupTag = t => /^[a-z]+:/.test(t);
const tagVal = t => t.replace(/^[a-z]+:/, "");
const tagsIn = (r, g) => (r.tags || []).filter(t => t.startsWith(g + ":")).map(tagVal);
const freeTags = r => (r.tags || []).filter(t => !isGroupTag(t));
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}
const shortName = email => (email || "").split("@")[0];
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
  return n;
}
const splitTags = s => s.split(/[,，]/).map(x => x.trim().replace(/^#/, "").replace(/:/g, " ")).filter(Boolean);
function showStatus(msg, detail) {
  const s = $("status");
  if (!msg) { s.hidden = true; s.textContent = ""; return; }
  s.className = "notice"; s.textContent = "";
  s.append(el("strong", {}, msg));
  if (detail) s.append(el("code", {}, detail));
  s.hidden = false;
}
function explain(error) {
  const m = (error && (error.message || error.error_description)) || String(error || "");
  if (/(relation|could not find the table|schema cache)/i.test(m)) return "Supabase에 테이블이 아직 없어요. setup.sql을 SQL Editor에서 실행해 주세요.";
  if (/column/i.test(m)) return "Supabase 칸 구성이 달라요. setup.sql을 다시 실행해 주세요.";
  if (/bucket not found/i.test(m)) return "이미지 보관함이 아직 없어요. setup.sql을 다시 실행해 주세요.";
  if (/JWT|session|not authenticated/i.test(m)) return "로그인이 풀렸어요. 다시 로그인해 주세요.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Supabase 창고에 연결이 안 돼요. 주소·키가 맞는지, 프로젝트가 멈춤(Paused) 상태는 아닌지 확인해 주세요.";
  return "문제가 생겼어요. 잠시 뒤 다시 해 주세요.";
}
async function copyText(text, btn, label) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "복사됐어요"; }
  catch { btn.textContent = "길게 눌러 선택"; }
  setTimeout(() => { btn.textContent = label; }, 1600);
}
function armDelete(btn, run) {
  let armed = false;
  btn.addEventListener("click", async () => {
    if (!armed) {
      armed = true; btn.dataset.label = btn.textContent; btn.textContent = "정말 삭제?"; btn.classList.add("armed");
      setTimeout(() => { if (armed) { armed = false; btn.textContent = btn.dataset.label; btn.classList.remove("armed"); } }, 3000);
      return;
    }
    armed = false; btn.textContent = "삭제 중…";
    await run();
    btn.textContent = btn.dataset.label; btn.classList.remove("armed");
  });
}
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1080 / bmp.width);
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return blob || file;
  } catch { return file; }
}
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
async function signAll(rows) {
  const paths = rows.filter(r => r.image_path).map(r => r.image_path);
  const map = {};
  if (paths.length) {
    const { data } = await sb.storage.from(BUCKET).createSignedUrls(paths, 60 * 60 * 6);
    (data || []).forEach(s => { if (s.signedUrl) map[s.path] = s.signedUrl; });
  }
  return rows.map(r => ({ ...r, imageUrl: map[r.image_path] || "" }));
}

/* ===== 로그인 ===== */
sb.auth.onAuthStateChange((_event, session) => {
  const u = session?.user || null;
  const changed = (u?.id || null) !== (user?.id || null);
  user = u;
  $("loginView").hidden = !!u;
  $("appView").hidden = !u;
  $("who").textContent = u ? shortName(u.email) : "";
  if (u && changed) setTimeout(loadAll, 0);
  if (!u) { S.refs = []; S.loaded = false; }
});
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("loginBtn"); btn.disabled = true; btn.textContent = "확인 중…";
  $("loginErr").hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("l-email").value.trim(), password: $("l-pw").value });
  btn.disabled = false; btn.textContent = "로그인";
  if (error) {
    $("loginErr").textContent = /invalid login/i.test(error.message) ? "이메일이나 비밀번호가 맞지 않아요." :
      /not confirmed/i.test(error.message) ? "이메일 인증이 안 된 계정이에요. 관리자에게 Auto Confirm으로 다시 만들어 달라고 해 주세요." : explain(error);
    $("loginErr").hidden = false;
  }
});
$("logoutBtn").addEventListener("click", () => sb.auth.signOut());

/* ===== 불러오기 ===== */
async function loadAll() {
  S.loaded = false; render();
  const r = await sb.from("refs").select("*").order("created_at", { ascending: false });
  S.refs = r.error ? [] : await signAll(r.data);
  S.loaded = true;
  if (r.error) showStatus(explain(r.error), r.error.message); else showStatus(null);
  render();
  takeShared();
}

/* ===== 그리기 ===== */
function setCat(c) {
  S.cat = c; S.query = ""; $("q").value = "";
  try { localStorage.setItem("nnb-ref-cat", c); } catch {}
  render();
}
const q = () => S.query.trim().toLowerCase();
const hit = fields => !q() || fields.join(" ").toLowerCase().includes(q());
function matches(r) {
  const sel = S.sel[S.cat];
  for (const [g, set] of Object.entries(sel)) {
    if (!set.size) continue;
    const have = g === "free" ? freeTags(r) : tagsIn(r, g);
    if (!have.some(v => set.has(v))) return false;
  }
  return hit([r.title, r.why, r.idea, r.copy_text, r.source, r.url, (r.tags || []).map(tagVal).join(" ")]);
}
function render() {
  const cat = CATS[S.cat];
  document.documentElement.style.setProperty("--cat", cat.color);
  renderSpaces(); renderFilters();
  $("spaceHint").textContent = cat.hint;
  const list = $("list"); list.textContent = "";
  if (!S.loaded) { list.append(el("div", { class: "empty", style: "grid-column:1/-1" }, "불러오는 중…")); return; }
  const inCat = S.refs.filter(r => r.category === S.cat);
  if (!inCat.length) { list.append(emptyBox(`아직 ${cat.name} 레퍼런스가 없어요`, "링크 붙여넣고, 태그 고르고, 왜 저장했는지 한 줄 남기면 끝.", "+ 첫 레퍼런스 추가", () => openRefForm(null))); return; }
  const rows = inCat.filter(matches);
  if (!rows.length) { list.append(emptyBox("조건에 맞는 레퍼런스가 없어요", "태그 필터를 몇 개 풀어 보세요.")); return; }
  rows.forEach(r => list.append(refCard(r)));
}
function emptyBox(title, sub, btnLabel, onClick) {
  return el("div", { class: "empty", style: "grid-column:1/-1" }, el("strong", {}, title), sub,
    btnLabel ? el("button", { class: "btn-add", type: "button", onclick: onClick }, btnLabel) : null);
}
function renderSpaces() {
  const nav = $("spaces"); nav.textContent = "";
  Object.entries(CATS).forEach(([id, c]) => nav.append(el("button", { class: "space", type: "button", "aria-pressed": String(S.cat === id), style: `--cat:${c.color}`,
    onclick: () => setCat(id) }, c.name, el("span", { class: "n" }, String(S.refs.filter(r => r.category === id).length)))));
}
function renderFilters() {
  const box = $("fgroups"); box.textContent = "";
  const cat = CATS[S.cat], sel = S.sel[S.cat];
  const inCat = S.refs.filter(r => r.category === S.cat);
  const toggle = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); render(); };
  cat.groups.forEach(g => {
    const chips = g.opts.map(v => {
      const n = inCat.filter(r => tagsIn(r, g.id).includes(v)).length;
      return el("button", { class: "chip", type: "button", "aria-pressed": String(sel[g.id].has(v)), onclick: () => toggle(sel[g.id], v) }, v, el("span", { class: "n" }, String(n)));
    });
    box.append(el("div", { class: "fgroup" }, el("span", {}, g.name), el("div", { class: "chips" }, chips)));
  });
  const counts = {};
  inCat.forEach(r => freeTags(r).forEach(t => counts[t] = (counts[t] || 0) + 1));
  [...sel.free].forEach(t => { if (!counts[t]) sel.free.delete(t); });
  const free = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 14);
  if (free.length) box.append(el("div", { class: "fgroup" }, el("span", {}, "기타 태그"), el("div", { class: "chips" },
    free.map(t => el("button", { class: "chip free", type: "button", "aria-pressed": String(sel.free.has(t)), onclick: () => toggle(sel.free, t) }, "#" + t, el("span", { class: "n" }, String(counts[t])))))));
  $("freset").hidden = !Object.values(sel).some(s => s.size);
}
$("freset").addEventListener("click", () => { Object.values(S.sel[S.cat]).forEach(s => s.clear()); render(); });

function copyBox(text) {
  const copy = el("button", { class: "mini", type: "button" }, "복사");
  copy.addEventListener("click", () => copyText(text, copy, "복사"));
  return el("details", { class: "script" }, el("summary", {}, "카피 · 스크립트"), el("p", { class: "txt" }, text), copy);
}
function refCard(r) {
  const c = CATS[r.category] || CATS.organic;
  const fmt = tagsIn(r, "format")[0];
  const del = el("button", { class: "del", type: "button" }, "삭제");
  armDelete(del, async () => {
    const { error } = await sb.from("refs").delete().eq("id", r.id);
    if (error) { showStatus(explain(error), error.message); return; }
    if (r.image_path) await sb.storage.from(BUCKET).remove([r.image_path]);
    S.refs = S.refs.filter(x => x.id !== r.id); render();
  });
  const tagSpans = [
    ...c.groups.filter(g => g.id !== "format").flatMap(g => tagsIn(r, g.id).map(v => el("span", { class: g.id === "point" ? "pt" : "" }, v))),
    ...freeTags(r).map(t => el("span", {}, "#" + t)),
  ];
  return el("article", { class: "card", style: `--cat:${c.color}` },
    el("div", { class: "thumb" + (r.imageUrl ? "" : " short") },
      r.imageUrl ? el("img", { src: r.imageUrl, alt: "", loading: "lazy" }) : el("div", { class: "ph" }, fmt || c.name),
      el("span", { class: "label" }, c.name), fmt ? el("span", { class: "plat" }, fmt) : null),
    el("div", { class: "body" },
      el("h3", {}, r.title || "(제목 없음)"),
      (r.source || r.period) ? el("div", { class: "src" }, [r.source, r.period ? `게재 ${r.period}` : ""].filter(Boolean).join(" · ")) : null,
      r.why ? el("p", { class: "why" }, el("span", { class: "k" }, "왜 저장했나"), r.why) : null,
      r.idea ? el("p", { class: "idea" }, el("span", { class: "k" }, "응용 아이디어"), r.idea) : null,
      r.copy_text ? copyBox(r.copy_text) : null,
      tagSpans.length ? el("div", { class: "tags" }, tagSpans) : null,
      el("div", { class: "meta" },
        el("div", { class: "by" }, el("span", {}, shortName(r.author) || "—"), el("time", {}, fmtDate(r.created_at))),
        el("div", { class: "acts" },
          r.url ? el("a", { href: r.url, target: "_blank", rel: "noopener" }, "원본 ↗") : null,
          el("button", { type: "button", onclick: () => openRefForm(r) }, "수정"), del))));
}

/* ===== 입력 ===== */
let editing = null, pendingBlob = null, keepImage = true, formCat = "organic", formSel = {};
function renderCatPick() {
  const box = $("f-cat"); box.textContent = "";
  Object.entries(CATS).forEach(([id, c]) => box.append(el("button", { type: "button", "aria-pressed": String(formCat === id), style: `--cat:${c.color}`,
    onclick: () => { if (formCat !== id) { formCat = id; resetFormSel(null); renderFormGroups(); renderCatPick(); } } }, c.name)));
  $("periodField").hidden = formCat !== "paid";
}
function resetFormSel(r) {
  formSel = Object.fromEntries(CATS[formCat].groups.map(g => [g.id, new Set(r ? tagsIn(r, g.id) : [])]));
}
function renderFormGroups() {
  const box = $("f-groups"); box.textContent = "";
  const color = CATS[formCat].color;
  CATS[formCat].groups.forEach(g => {
    const chips = g.opts.map(v => el("button", { class: "chip", type: "button", "aria-pressed": String(formSel[g.id].has(v)), style: `--cat:${color}`,
      onclick: () => { formSel[g.id].has(v) ? formSel[g.id].delete(v) : formSel[g.id].add(v); renderFormGroups(); } }, v));
    box.append(el("div", { class: "field" }, el("span", {}, g.name, " ", g.required ? el("small", { class: "req" }, "필수") : el("small", {}, "여러 개 골라도 돼요")), el("div", { class: "chips" }, chips)));
  });
}
function setPreview(src) {
  const img = $("f-prev");
  if (src) { img.src = src; img.hidden = false; $("clearImg").hidden = false; $("dropMsg").textContent = "다른 캡처를 넣으면 바뀌어요"; }
  else { img.removeAttribute("src"); img.hidden = true; $("clearImg").hidden = true; $("dropMsg").textContent = "캡처를 여기에 붙여넣기(⌘V/Ctrl+V)하거나 끌어다 놓기"; }
}
function guessFormat(url) {
  const u = (url || "").toLowerCase();
  if (formCat !== "organic") return null;
  if (u.includes("instagram.com/reel")) return "릴스";
  if (u.includes("tiktok.com")) return "틱톡";
  if (u.includes("blog.naver.com") || u.includes("tistory.com") || u.includes("brunch.co.kr")) return "블로그";
  if (u.includes("instagram.com/p/")) return "카드뉴스";
  return null;
}
function openRefForm(r) {
  editing = r; pendingBlob = null; keepImage = true;
  $("refFormTitle").textContent = r ? "레퍼런스 수정" : "레퍼런스 추가";
  formCat = r?.category || S.cat;
  $("f-url").value = r?.url || ""; $("f-title").value = r?.title || "";
  $("f-src").value = r?.source || ""; $("f-period").value = r?.period || "";
  $("f-tags").value = r ? freeTags(r).join(", ") : "";
  $("f-why").value = r?.why || ""; $("f-idea").value = r?.idea || ""; $("f-copy").value = r?.copy_text || "";
  resetFormSel(r); renderCatPick(); renderFormGroups(); setPreview(r?.imageUrl || null);
  $("refErr").hidden = true; $("refSheet").hidden = false;
  setTimeout(() => (r ? $("f-title") : $("f-url")).focus(), 30);
}
function takeImage(file) { if (!file || !file.type.startsWith("image/")) return; pendingBlob = file; setPreview(URL.createObjectURL(file)); }
$("f-url").addEventListener("input", e => {
  const f = guessFormat(e.target.value);
  if (!editing && f && !formSel.format.size) { formSel.format.add(f); renderFormGroups(); }
});
$("pickImg").addEventListener("click", () => $("f-file").click());
$("f-file").addEventListener("change", e => { takeImage(e.target.files[0]); e.target.value = ""; });
$("clearImg").addEventListener("click", () => { pendingBlob = null; keepImage = false; setPreview(null); });
$("refForm").addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); takeImage(item.getAsFile()); }
});
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); takeImage(e.dataTransfer.files[0]); });
function formErr(msg) { $("refErr").textContent = msg; $("refErr").hidden = false; }
$("refForm").addEventListener("submit", async e => {
  e.preventDefault();
  const title = $("f-title").value.trim();
  if (!title) { formErr("제목을 적어 주세요."); $("f-title").focus(); return; }
  const missing = CATS[formCat].groups.find(g => g.required && !formSel[g.id].size);
  if (missing) { formErr(`${missing.name}를 하나 이상 골라 주세요. 나중에 왜 저장했는지 찾을 때 필요해요.`); return; }
  const btn = $("refSave"); btn.disabled = true; btn.textContent = "저장 중…"; $("refErr").hidden = true;
  try {
    const oldPath = editing?.image_path || "";
    let imagePath = keepImage ? oldPath : "";
    if (pendingBlob) {
      const blob = await shrink(pendingBlob);
      const path = `refs/${newId()}.jpg`;
      const { error: upErr } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || "image/jpeg" });
      if (upErr) throw upErr;
      imagePath = path;
    }
    const tags = [
      ...CATS[formCat].groups.flatMap(g => g.opts.filter(v => formSel[g.id].has(v)).map(v => tagKey(g.id, v))),
      ...splitTags($("f-tags").value),
    ];
    const row = { category: formCat, url: $("f-url").value.trim(), title, source: $("f-src").value.trim(),
      period: formCat === "paid" ? $("f-period").value.trim() : "", tags,
      why: $("f-why").value.trim(), idea: $("f-idea").value.trim(), copy_text: $("f-copy").value.trim(),
      image_path: imagePath, updated_at: new Date().toISOString() };
    const { error } = editing ? await sb.from("refs").update(row).eq("id", editing.id) : await sb.from("refs").insert(row);
    if (error) throw error;
    if (oldPath && oldPath !== imagePath) await sb.storage.from(BUCKET).remove([oldPath]);
    if (!editing && formCat !== S.cat) S.cat = formCat;
    closeSheets(); await loadAll();
  } catch (err) { formErr(explain(err)); console.error(err); }
  finally { btn.disabled = false; btn.textContent = "저장"; }
});

/* ===== 공유로 들어온 링크 (?url= / ?text=) — 인스타 공유 버튼, 아이폰 단축어, 안드로이드 공유 대상 ===== */
function takeShared() {
  const p = new URLSearchParams(location.search);
  const raw = [p.get("url"), p.get("text"), p.get("title")].filter(Boolean).join(" ");
  if (!raw) return;
  try { history.replaceState(null, "", location.pathname); } catch {}
  const m = raw.match(/https?:\/\/[^\s"'<>]+/);
  let url = m ? m[0] : "";
  try { const u = new URL(url); if (/instagram\.com$/.test(u.hostname.replace(/^www\./, "")) || u.hostname.endsWith("instagram.com")) { u.search = ""; url = u.toString(); } } catch {}
  openRefForm(null);
  if (url) { $("f-url").value = url; $("f-url").dispatchEvent(new Event("input")); }
  const note = raw.replace(m ? m[0] : "", "").trim();
  if (note && !$("f-copy").value) $("f-copy").value = note;
  setTimeout(() => $("f-title").focus(), 60);
}

/* ===== 이벤트 ===== */
function closeSheets() { $("refSheet").hidden = true; editing = null; pendingBlob = null; }
$("refSheet").addEventListener("click", e => { if (e.target === $("refSheet")) closeSheets(); });
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheets));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("refSheet").hidden) closeSheets(); });
$("addBtn").addEventListener("click", () => openRefForm(null));
$("q").addEventListener("input", e => { S.query = e.target.value; render(); });

render();
</script>
</body>
</html>
